<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2C7A4B">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>FotoCesta</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="FotoCesta">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
html{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{
  --bg:#F1F5EF;--surface:#FFFFFF;--ink:#15211A;--muted:#5C6A60;--line:#D9E2D6;
  --accent:#2C7A4B;--accent-soft:#E0EFE4;--accent-ink:#FFFFFF;
  --warm:#C8651A;--warm-soft:#FBEBDD;--paper:#FFFFFF;--danger:#B3372B;
  --shadow:0 8px 28px rgba(21,33,26,.14);
  --f-disp:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0F1511;--surface:#18211B;--ink:#E5EEE7;--muted:#93A298;--line:#2A362E;
  --accent:#5CBD80;--accent-soft:#1F3527;--accent-ink:#0F1511;--warm:#EFA052;--warm-soft:#3A2A1B;--paper:#1C261F;--danger:#EE7B6E;
  --shadow:0 8px 28px rgba(0,0,0,.5);}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0F1511;--surface:#18211B;--ink:#E5EEE7;--muted:#93A298;--line:#2A362E;
  --accent:#5CBD80;--accent-soft:#1F3527;--accent-ink:#0F1511;--warm:#EFA052;--warm-soft:#3A2A1B;--paper:#1C261F;--danger:#EE7B6E;
  --shadow:0 8px 28px rgba(0,0,0,.5);}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 190px}

/* cabecera */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.brand{font:800 26px/1 var(--f-disp);letter-spacing:-.02em}
.brand span{color:var(--accent)}
.hr{display:flex;align-items:flex-end;gap:10px}
.gear{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;color:var(--muted)}
.gear svg{width:20px;height:20px}
.est{text-align:right}
.est small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.est b{font:600 20px/1.1 var(--f-mono);color:var(--warm)}
.est em{font-style:normal;font-size:12px;color:var(--muted)}

h2{font:700 19px/1.2 var(--f-disp);margin:22px 0 10px;text-wrap:balance}
h3{font:600 12px/1 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
p.note{color:var(--muted);font-size:13px;margin:6px 0}

/* añadir manual */
.add{display:flex;gap:8px;margin-top:14px}
.add input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 12px;font:inherit}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.5}

/* sugerencias */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px dashed var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chip.on{background:var(--accent);color:var(--accent-ink);border-style:solid}
.chip.off{border-color:var(--line);color:var(--muted);border-style:solid}

/* lista */
ul.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:32px 1fr auto 28px;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;font-size:14px;color:transparent}
.done .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.done .nm b{text-decoration:line-through;color:var(--muted)}
.nm{min-width:0}
.nm b{font-weight:600;display:block;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
.nm small{color:var(--muted);font-size:12px}
.nm small .pr{color:var(--warm);font-family:var(--f-mono)}
.qty{display:flex;align-items:center;gap:2px;background:var(--bg);border-radius:10px}
.qty button{border:0;background:transparent;width:30px;height:30px;font-size:18px;font-weight:600}
.qty span{min-width:18px;text-align:center;font-family:var(--f-mono)}
.lk{border:0;background:none;padding:0;color:var(--accent);font-size:12px;font-weight:600;text-decoration:underline}
.x{border:0;background:transparent;color:var(--muted);font-size:20px;width:28px;height:28px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:18px;display:grid;gap:12px}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mode{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:left;display:grid;gap:4px}
.mode b{font:700 15px/1.2 var(--f-disp)}
.mode span{font-size:12.5px;color:var(--muted)}
.mode svg{width:26px;height:26px;color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* ticket / presupuesto */
.ticket{background:var(--paper);border:1px solid var(--line);border-radius:4px 4px 0 0;padding:16px 16px 22px;position:relative;font-family:var(--f-mono);
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/16px 8px repeat-x;
  mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/16px 8px repeat-x}
.ticket .hd{text-align:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-bottom:1px dashed var(--line);padding-bottom:10px;margin-bottom:10px}
.bar{display:grid;grid-template-columns:96px 1fr 76px;align-items:center;gap:8px;padding:6px 0;font-size:13px}
.bar .n{font-family:var(--f-body);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;background:var(--muted);opacity:.45;border-radius:5px}
.bar.best .fill{background:var(--accent);opacity:1}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}
.bar.best .v{color:var(--accent);font-weight:600}
.bar .flag{grid-column:2/4;font-size:11px;color:var(--muted);font-family:var(--f-body);margin-top:-4px}
.pick{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;font-family:var(--f-body);display:grid;gap:4px}
.pick b{font:700 17px/1.2 var(--f-disp)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td{padding:8px 4px;border-top:1px solid var(--line);vertical-align:top}
.tbl td:last-child{text-align:right;white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:5px}
.tag.real{background:var(--accent-soft);color:var(--accent)}
.tag.est{background:var(--warm-soft);color:var(--warm)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}

/* hábitos */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{font:600 20px/1.2 var(--f-mono)}
.sug{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.sug:first-child{border-top:0}
.sug small{display:block;color:var(--muted);font-size:12px}
.rank{display:grid;grid-template-columns:1fr auto;gap:6px;font-size:14px;padding:6px 0;border-top:1px solid var(--line)}
.rank:first-child{border-top:0}

/* barra inferior */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center}
.quick{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:8px;padding:10px 16px 4px}
.qb{font-size:17px!important;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);padding:12px 4px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px}
.qb svg{width:24px;height:24px;flex:none}
#qVoz{background:var(--warm)}
.btn.grande{width:100%;padding:15px;font-size:16px}
.cantSel{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px}
.opciones{display:grid;gap:8px}
.opcion{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;display:grid;gap:2px}
.opcion b{font-weight:600}
.opcion small{color:var(--muted);font-size:12.5px}
.opcion:active{background:var(--accent-soft)}
.det{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
.det summary{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer;font-weight:600;list-style:none}
.det summary::-webkit-details-marker{display:none}
.det[open] summary{border-bottom:1px solid var(--line)}
.det .tbl{margin:0 14px 10px;width:calc(100% - 28px)}
#qVoz.on{animation:pulso 1s ease-in-out infinite}
@keyframes pulso{50%{transform:scale(1.06);opacity:.85}}
.cam{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam.flash::after{content:"";position:absolute;inset:0;background:#fff;opacity:.7}
.camTop{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;color:#fff;background:linear-gradient(#000a,#0000);font:700 18px var(--f-disp)}
.camX{border:0;background:#0006;color:#fff;width:44px;height:44px;border-radius:50%;font-size:28px;line-height:1}
.camHint{position:relative;color:#fff;background:#0008;padding:6px 12px;border-radius:10px;font-size:14px;margin:0 16px 16px}
.shutter{position:relative;width:84px;height:84px;border-radius:50%;border:6px solid #fff;background:#fff5;margin-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.shutter:active{background:#fff}
.vozTxt{position:fixed;left:16px;right:16px;bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:31;background:var(--warm);color:#fff;font:600 18px var(--f-body);padding:14px 16px;border-radius:14px;text-align:center}
.tab{border:0;background:transparent;padding:10px 4px 12px;font-size:12px;font-weight:600;color:var(--muted);display:grid;justify-items:center;gap:3px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.fab{justify-self:center;width:64px;height:64px;border-radius:50%;border:4px solid var(--bg);background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-26px;box-shadow:var(--shadow)}
.fab svg{width:28px;height:28px}

.av{position:relative;display:inline-grid;place-items:center;width:var(--t);height:var(--t);border-radius:50%;background:var(--c);color:#fff;font:700 calc(var(--t)*.45) var(--f-body);flex:none;box-shadow:0 0 0 2px var(--surface)}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.av .enl{position:absolute;right:-1px;bottom:-1px;width:30%;height:30%;min-width:8px;min-height:8px;border-radius:50%;background:#2fbf5b;box-shadow:0 0 0 2px var(--surface)}
.famBar{display:flex;align-items:center;gap:10px;margin-top:12px}
.famAvs{display:flex}
.famAvs .av+.av{margin-left:-8px}
.listaSel{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.listaSel span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.listaSel small{color:var(--muted);font-weight:500;flex:none}
.porq{display:flex;align-items:center;gap:5px;margin-top:3px}
.lbl{display:block;font-weight:600;font-size:13px;margin-bottom:6px}
.field.big{font-size:17px;padding:12px}
.perfil{display:flex;gap:14px;align-items:flex-end;margin:12px 0}
.pfFoto{border:0;background:none;display:grid;justify-items:center;gap:4px;color:var(--muted);padding:0}
.pfFoto #pf-prev{width:76px;height:76px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;overflow:hidden}
.pfFoto #pf-prev img{width:100%;height:100%;object-fit:cover}
.pfFoto svg{width:30px;height:30px}
.codigo{font:600 38px/1 var(--f-mono);letter-spacing:.18em;text-align:center;background:var(--accent-soft);color:var(--accent);border-radius:14px;padding:18px 8px;margin:12px 0}
.miembros{display:grid;gap:10px}
.mb{display:flex;align-items:center;gap:10px;font-weight:600}
.lrow{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center}
.lrow .btn{padding:8px 10px;font-size:13px}
.lrow.on .opcion{border-color:var(--accent)}

.famHead{margin-top:14px;display:grid;gap:10px}
button.famAvs{border:0;background:none;padding:0;flex:none}
.famTop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.famName{border:0;background:none;padding:0;text-align:left;font:800 30px/1.1 var(--f-disp);letter-spacing:-.01em;color:var(--ink);min-width:0;overflow-wrap:anywhere}
.listaBig{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;text-align:left;display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:10px}
.listaBig small{grid-column:1/-1;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.listaBig span{font:700 22px/1.2 var(--f-disp);color:var(--accent);overflow-wrap:anywhere}
.listaBig em{font-style:normal;font-size:12.5px;color:var(--muted);white-space:nowrap}
.famTit{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 6px}
.famTit .btn,.mbEd{padding:7px 10px;font-size:13px}
.mb{display:flex;align-items:center;gap:10px;font-weight:600}
/* hojas y avisos */
.sheet{position:fixed;inset:0;z-index:10;background:rgba(10,16,12,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .body{background:var(--surface);width:100%;max-width:560px;max-height:86%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin-top:0}
.rv{display:grid;grid-template-columns:24px 1fr 64px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.rv input[type=text],.rv input[type=number],.field{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 8px;font:inherit}
.rv small{grid-column:2/4;color:var(--muted);font-size:12px;margin-top:-4px}
.busy{position:fixed;inset:0;z-index:20;background:rgba(10,16,12,.55);display:grid;place-items:center;padding:16px}
.busy .b{background:var(--surface);border-radius:18px;padding:22px;max-width:320px;width:100%;display:grid;gap:14px;justify-items:center;text-align:center}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--accent-soft);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.toast button{border:0;background:none;color:var(--accent);font-weight:700;padding:4px 2px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:30;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px)}
</style>
</head><body>
<div class="wrap">
  <header>
    <div class="brand">Foto<span>Cesta</span></div>
    <div class="hr"><div class="est" id="est"></div><button class="gear" data-act="ajustes" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
  </header>

  <main id="v-lista"></main>
  <main id="v-presu" hidden></main>
  <main id="v-habitos" hidden></main>
</div>

<nav>
<div class="quick">
  <button class="qb" id="qVoz" data-act="qVoz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Dictar productos</button>
</div>
<div class="in">
  <button class="tab" data-tab="lista" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>Lista</button>
  <button class="tab" data-tab="presu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Presupuesto</button>
  <button class="tab" data-tab="habitos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10M10 19V5M16 19v-7M22 19H2"/></svg>Hábitos</button>
</div></nav>
<div class="vozTxt" id="vozTxt" hidden onclick="vozTerminar()"></div>

<datalist id="catlist"></datalist>
<input type="file" id="fotoPerfil" accept="image/*" hidden>

const CAT_NOM=Object.fromEntries(CAT_IDX.map(e=>[toks(e.n),e]));
function matchCat(nombre){
  const t=' '+toks(nombre)+' ';if(CAT_NOM[t.trim()])return CAT_NOM[t.trim()];let best=null,bestM=null;
  for(const e of CAT_IDX){if(!e.m)continue;for(const k of e.kw){if(k.length<3)continue;if(t.includes(' '+k+' ')&&(!bestM||k.length>bestM.l))bestM={e,l:k.length}}}
  if(bestM)return bestM.e;
  for(const e of CAT_IDX)for(const k of e.kw){if(k.length<3)continue;if(t.includes(' '+k+' ')&&(!best||k.length>best.l||(k.length===best.l&&e.m&&!best.e.m)))best={e,l:k.length}}
  return best?best.e:null;
}

let VOCAB=null;
function vocab(){
  if(VOCAB)return VOCAB;
  const s=new Set();
  for(const e of CAT_IDX){for(const k of e.kw)for(const w of k.split(' '))if(w.length>=4)s.add(w);for(const w of toks(e.n).split(' '))if(w.length>=4)s.add(w)}
  VOCAB=[...s];return VOCAB;
}
function lev(a,b,max){
  if(Math.abs(a.length-b.length)>max)return max+1;
  let prev=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){const cur=[i];let best=i;
    for(let j=1;j<=b.length;j++){cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));if(cur[j]<best)best=cur[j]}
    if(best>max)return max+1;prev=cur}
  return prev[b.length];
}
function limpiaPalabra(raw){
  let t=String(raw||'');
  t=t.replace(/(?<=[A-Za-zÁÉÍÓÚÑáéíóúñ])[|\/!1](?=[A-Za-zÁÉÍÓÚÑáéíóúñ]|$)/g,'l').replace(/^[|\/!](?=[A-Za-z])/,'l').replace(/(?<=[A-Za-z])0(?=[A-Za-z])/g,'o');
  return t.replace(/[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9]/g,'');
}
const corrCache=new Map();
const COMUNES=new Set('materia grasa grasas contenido ingredientes ingrediente sabor calidad origen nuevo nueva receta peso neto energia valor valores consumir preferente conservar lugar fresco seco envase producto productos fabricado espana hecho azucares proteinas hidratos carbono fibra sodio porcion racion unidades gramos litros formato familiar ahorro oferta precio marca original clasico clasica extra mejor sin con para natural fresca'.split(' '));
function corrige(w,conf){
  const t=toks(w);if(!t||t.includes(' '))return t;if(COMUNES.has(t)||(conf||0)>=88)return t;
  const ck=t;if(corrCache.has(ck))return corrCache.get(ck);
  let r=t;
  if(t.length>=5&&!/^\d+$/.test(t)){
    const V=vocab();if(!V.includes(t)){const max=t.length>=8?2:1;let best=null,bd=max+1;
      for(const v of V){const d=lev(t,v,max);if(d<bd){bd=d;best=v;if(d===1&&max===1)break}}
      if(best&&bd<=max)r=best}
  }
  corrCache.set(ck,r);return r;
}

/* ---------- precios ---------- */
function activeSupers(){const a=S.ajustes.general?.supers;return SUPERS.filter(s=>!a||a.includes(s.id))}
function priceInfo(id,sup){
  const p=S.productos[id];const v=p?.precios?.[sup];
  if(v&&v.p>0)return{p:v.p,src:v.src==='web'?'web':'ticket'};
  const e=matchCat(p?.nombre);if(e)return{p:Math.round(e.p*IDX[sup]*100)/100,src:'est'};
  return null;
}
function priceOf(id,sup){return priceInfo(id,sup)?.p??null}
function avgPrice(id){const v=SUPERS.map(s=>priceOf(id,s.id)).filter(n=>n>0);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}
function cheapest(id){let best=null;for(const s of activeSupers()){const i=priceInfo(id,s.id);if(i&&(!best||i.p<best.p))best={sup:s.id,...i}}return best}
function budget(){
  const items=Object.entries(S.lista).filter(([,x])=>!x.marcado);
  const sups=activeSupers();
  const sinPrecio=items.filter(([id])=>avgPrice(id)==null).length;
  const cost=(id,sup)=>priceOf(id,sup)??avgPrice(id);
  const per=sups.map(s=>{let t=0,miss=0;for(const [id,x] of items){const i=priceInfo(id,s.id);const p=i?i.p:avgPrice(id);if(p==null)continue;if(!i||i.src==='est')miss++;t+=p*(x.cant||1)}return{s,t,miss}}).sort((a,b)=>a.t-b.t);
  let pair=null;
  for(let i=0;i<sups.length;i++)for(let j=i+1;j<sups.length;j++){
    let t=0;const a=sups[i].id,b=sups[j].id;
    for(const [id,x] of items){const pa=cost(id,a),pb=cost(id,b);if(pa==null)continue;t+=Math.min(pa,pb)*(x.cant||1)}
    if(!pair||t<pair.t)pair={a,b,t};
  }
  return{items,per,pair,sinPrecio};
}

async function addItems(arr,origen){
  const nuevos=[];
  for(const it of arr){
    const nombre=String(it.nombre||'').trim();if(!nombre)continue;
    const id=slug(nombre);
    if(!S.productos[id]){const e=matchCat(nombre);await put('productos',id,{nombre,cat:CATS.includes(it.cat)?it.cat:(e?.c||'Otros'),formato:e?.f||'',precios:{},compras:[],creado:hoy()});}
    const cur=S.lista[id];
    await put('lista',id,{nombre:S.productos[id].nombre,cat:S.productos[id].cat,cant:Math.max(cur?.cant||0,Math.max(1,Math.round(Number(it.cant)||1))),marcado:false,origen:origen||'manual',ts:Date.now()});
    if(avgPrice(id)==null)nuevos.push(id);
  }
}

function sugerencias(){
  const out=[];
  for(const [id,p] of Object.entries(S.productos)){
    const f=(p.compras||[]).map(c=>c.fecha).filter(Boolean).sort();
    if(f.length<2||S.lista[id])continue;
    const iv=[];for(let i=1;i<f.length;i++){const d=(new Date(f[i])-new Date(f[i-1]))/DAY;if(d>0)iv.push(d)}
    if(!iv.length)continue;
    const media=iv.reduce((a,b)=>a+b,0)/iv.length;
    const hace=dias(f[f.length-1]);
    if(hace>=media*0.85)out.push({id,nombre:p.nombre,media:Math.round(media),hace,cant:Math.round((p.compras.reduce((a,c)=>a+(c.cant||1),0))/p.compras.length)||1});
  }
  return out.sort((a,b)=>b.hace/b.media-a.hace/a.media);
}

async function terminarCompra(sup){
  const hechos=Object.entries(S.lista).filter(([,x])=>x.marcado);
  for(const [id,x] of hechos){
    const p=clone(S.productos[id]||{nombre:x.nombre,cat:x.cat,precios:{}});
    p.compras=[...(p.compras||[]),{fecha:hoy(),cant:x.cant||1,super:sup,precio:priceOf(id,sup)}].slice(-40);
    await put('productos',id,p);
    await del('lista',id);
  }
  let tot=0;for(const [id,x] of hechos){const p=priceOf(id,sup);if(p)tot+=p*(x.cant||1)}
  if(hechos.length)await put('tickets','t'+Date.now(),{fecha:hoy(),super:sup,total:Math.round(tot*100)/100,n:hechos.length});
  closeSheet();toast(`Compra registrada: ${hechos.length} productos.`);
}


const NUM={un:1,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,docena:12};
function parseVoz(txt){
  return txt.toLowerCase().replace(/\s+(y|e|además|tambien|también|más|mas)\s+/g,',').split(/[,.;]+/).map(t=>t.trim()).filter(Boolean).map(t=>{
    let cant=1;t=t.replace(/^(añade|añadir|apunta|pon|compra|comprar|necesito|quiero)\s+/,'');
    const m=t.match(/^(media docena|una docena|\d+|un|uno|una|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|once|doce)\s+(?:de\s+)?(.+)$/);
    if(m){cant=/docena/.test(m[1])?1:(+m[1]||NUM[m[1]]||1);t=m[2]}
    t=t.replace(/^(kilo|kilos|paquete|paquetes|botella|botellas|bote|botes|lata|latas|bolsa|bolsas|brik|briks|litro|litros)\s+(de\s+)?/,'');
    return{nombre:t.charAt(0).toUpperCase()+t.slice(1),cant};
  }).filter(p=>p.nombre.length>=2);
}

/* ---------- buscar modelos de un producto ---------- */
function candidatos(q){
  const qt=toks(q).split(' ').filter(w=>w.length>=2);
  if(!qt.length)return[];
  const full=qt.join(' ');const res=[];
  for(const e of CAT_IDX){
    const nombre=toks(e.n);const bolsa=' '+[nombre,...e.kw,e.t||''].join(' ')+' ';
    if(!qt.every(w=>bolsa.includes(' '+w+' ')||(w.length>=5&&bolsa.includes(' '+w))))continue;
    let sc=0;
    if(nombre===full)sc+=100;
    if(e.kw.includes(full))sc+=40;
    if(nombre.startsWith(qt[0]))sc+=15;
    if(!e.m)sc+=10;
    sc-=nombre.split(' ').length;
    res.push({e,sc});
  }
  return res.sort((a,b)=>b.sc-a.sc).map(x=>x.e);
}
function resolver(texto){
  let c=candidatos(texto);
  if(!c.length){const corr=toks(texto).split(' ').map(w=>corrige(w,0)).join(' ');if(corr!==toks(texto))c=candidatos(corr)}
  if(!c.length){const m=matchCat(texto);if(m){const mc=candidatos(m.n.split(' ')[0]);c=[m,...mc.filter(x=>x!==m)]}}
  const exacto=c.find(e=>toks(e.n)===toks(texto));
  if(exacto&&(toks(texto).includes(' ')||c.length===1))return{directo:exacto};
  if(c.length===1)return{directo:c[0]};
  if(!c.length)return{libre:true};
  return{opciones:c.slice(0,20)};
}

let deshacer=null;
async function anadirALista(entradas,origen){
  const antes={};const nombres=[];
  for(const p of entradas){
    const e=p.e||null;const nombre=e?e.n:cap(String(p.nombre||'').trim());if(!nombre)continue;
    const id=slug(nombre);
    if(!(id in antes))antes[id]=S.lista[id]?clone(S.lista[id]):null;
    if(!S.productos[id])await put('productos',id,{nombre,cat:e?.c||'Otros',formato:e?.f||'',precios:{},compras:[],creado:hoy()});
    const cur=S.lista[id];
    await put('lista',id,{nombre:S.productos[id].nombre,cat:S.productos[id].cat,cant:(cur?(cur.cant||1):0)+(p.cant||1),marcado:false,origen,ts:Date.now(),por:cur?.por||yo?.uid||null});
    nombres.push(nombre+((p.cant||1)>1?' ×'+p.cant:''));

  if(nombres.length)deshacer=antes;

async function deshacerUltimo(){

  for(const [id,v] of Object.entries(deshacer)){if(v)await put('lista',id,v);else await del('lista',id)}

let cola=[],colaTotal=0,colaAnadidos=[],colaOrigen='manual';
async function procesarEntradas(entradas,origen){
  const directos=[];cola=[];colaAnadidos=[];colaOrigen=origen;
  for(const p of entradas){
    const r=resolver(p.nombre);
    if(r.directo)directos.push({e:r.directo,cant:p.cant});
    else if(r.libre)directos.push({nombre:p.nombre,cant:p.cant});
    else cola.push({texto:p.nombre,cant:p.cant,opciones:r.opciones});
  }
  colaAnadidos=await anadirALista(directos,origen);
  colaTotal=cola.length;
  if(cola.length)mostrarOpciones();
  else if(colaAnadidos.length)toast('Añadido: '+colaAnadidos.join(', '),[['Deshacer','deshacer']]);
}
function mostrarOpciones(){
  const it=cola[0];const n=colaTotal-cola.length+1;

}

const ES_IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

function vozReset(){clearTimeout(recTimer);recTimer=null;$('#qVoz').classList.remove('on');$('#vozTxt').hidden=true;rec=null}
async function vozTerminar(){
  if(!recEnd)return;recEnd=null;const txt=recFinal;recFinal='';
  const r=rec;vozReset();try{r&&r.abort()}catch{}
  const ps=parseVoz(txt||'');if(ps.length)await procesarEntradas(ps,'voz');
}
async function escuchar(){
  if(NATIVO){
    const b=$('#qVoz');b.classList.add('on');
    try{const r=await natCall('voz');if(r&&r.error){toast('No se puede usar el reconocimiento de voz en este móvil.');return}
      const ps=parseVoz(r&&r.text||'');if(ps.length)await procesarEntradas(ps,'voz')}
    finally{b.classList.remove('on')}
    return;
  }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR||ES_IOS){hojaDictado();return}
  if(rec){vozTerminar();return}
  rec=new SR();rec.lang='es-ES';rec.interimResults=true;rec.maxAlternatives=1;rec.continuous=false;
  recFinal='';recEnd=true;
  $('#qVoz').classList.add('on');$('#vozTxt').hidden=false;$('#vozTxt').textContent='Te escucho… (toca para terminar)';
  const vigilar=ms=>{clearTimeout(recTimer);recTimer=setTimeout(vozTerminar,ms)};
  vigilar(8000);

/* ---------- presupuesto detallado ---------- */
function presupuesto(){
  const items=Object.entries(S.lista);
  const sups=activeSupers();
  const per=sups.map(s=>{
    let t=0,est=0,sin=0;const lineas=[];
    for(const [id,x] of items){
      const cant=x.cant||1;const i=priceInfo(id,s.id);let p=i?i.p:null,src=i?i.src:null;
      if(p==null){const a=avgPrice(id);if(a!=null){p=Math.round(a*100)/100;src='media'}}
      if(p==null){sin++;lineas.push({id,x,cant,p:null});continue}
      if(src!=='ticket'&&src!=='web')est++;
      t+=p*cant;lineas.push({id,x,cant,p,src});
    }
    return{s,t:Math.round(t*100)/100,est,sin,lineas};
  }).sort((a,b)=>a.t-b.t);
  let pair=null;
  for(let i=0;i<sups.length;i++)for(let j=i+1;j<sups.length;j++){
    let t=0;const a=sups[i].id,b=sups[j].id,en={};
    for(const [id,x] of items){const pa=priceOf(id,a)??avgPrice(id),pb=priceOf(id,b)??avgPrice(id);if(pa==null)continue;t+=Math.min(pa,pb)*(x.cant||1);en[id]=pa<=pb?a:b}
    if(!pair||t<pair.t)pair={a,b,t:Math.round(t*100)/100,en};
  }
  return{items,per,pair};
}

  const uds=P.items.reduce((a,[,x])=>a+(x.cant||1),0);const best=P.per[0];const max=Math.max(...P.per.map(p=>p.t),0.01);

  ${modo==='unir'?`<label class="lbl" for="pf-code">Código de la familia</label><input class="field big" id="pf-code" autocomplete="off" autocapitalize="characters" maxlength="8" placeholder="Ej. KX7P2M">`:''}
  <div class="perfil"><button class="pfFoto" data-act="pfElegirFoto" aria-label="Elegir foto"><span id="pf-prev">${perfilFoto?`<img src="${esc(perfilFoto)}" alt="">`:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>'}</span><small>${perfilFoto?'Cambiar':'Foto'}</small></button>
  <div style="flex:1"><label class="lbl" for="pf-nom">${esOtro?'Nombre':'Tu nombre'}</label><input class="field big" id="pf-nom" autocomplete="off" placeholder="Ej. Toni" value="${esc(m?.nombre||'')}"></div></div>
  ${perfilFoto&&(modo==='editar'||modo==='miembro')?`<div class="actions" style="margin-top:0"><button class="btn line" data-act="pfQuitarFoto">Quitar foto</button></div>`:''}
  <div class="actions"><button class="btn grande" data-act="pfGuardar" data-m="${modo}" data-u="${esc(target||'')}">${modo==='crear'?'Crear familia':modo==='unir'?'Entrar':'Guardar'}</button></div>
  ${esOtro?`<div class="actions"><button class="btn line" style="color:var(--danger)" data-act="famQuitar" data-u="${esc(target)}">Quitar de la familia</button></div>`:''}
  <div class="actions"><button class="btn line" data-act="${modo==='miembro'?'famVer':modo==='editar'?'cerrar':'bienvenida'}">Volver</button></div>`);
}
function hojaBienvenida(){
  openSheet(`<h2>Listas en familia</h2>
  <p class="note">Crea una familia y comparte el código: todos podréis añadir productos a las mismas listas a la vez, cada uno con su nombre y su foto.</p>
  <div class="opciones">
    <button class="opcion" data-act="famCrear"><b>Crear una familia</b><small>Te doy un código para invitar a los demás</small></button>
    <button class="opcion" data-act="famUnir"><b>Tengo un código</b><small>Entrar en la familia que ha creado otro</small></button>
    <button class="opcion" data-act="famSolo"><b>Usar solo en este móvil</b><small>Sin compartir. Puedes crear la familia más tarde en Ajustes</small></button>
  </div>`);
}
function errFam(e){return({no_familia:'No existe ninguna familia con ese código. Revísalo.',sin_red:'Necesitas conexión a internet para esto.',sin_anonimo:'Falta activar el acceso «Anónimo» en Firebase (Authentication).','permission-denied':'Firebase ha rechazado el acceso. Revisa que las reglas de seguridad estén publicadas.'})[e?.code]||'No se ha podido completar. Vuelve a intentarlo.'}
async function guardarPerfil(modo,uid){
  const nombre=$('#pf-nom').value.trim();if(!nombre){toast('Escribe el nombre.');return}
  try{
    if(modo==='editar'||modo==='miembro'){
      const u=modo==='miembro'?uid:yo.uid;
      await famRef().collection('miembros').doc(u).update({nombre,foto:perfilFoto||''});
      S.miembros[u]={...S.miembros[u],nombre,foto:perfilFoto||''};
      toast('Guardado.');if(modo==='miembro')hojaCodigo(false);else closeSheet();render();return}
    busy(modo==='crear'?'Creando la familia…':'Entrando en la familia…');
    if(modo==='crear'){const fn=($('#pf-fam')?.value||'').trim();await crearFamilia(nombre,perfilFoto,fn);closeSheet();hojaCodigo(true)}
    else{const code=$('#pf-code').value.trim();if(code.length<4){busy();toast('Escribe el código de la familia.');return}await unirseFamilia(code,nombre,perfilFoto);closeSheet();toast('¡Ya estás en la familia!')}
    render();
  }catch(e){toast(errFam(e))}
  finally{busy()}
}
function textoInvitacion(){return `Únete a ${S.familia?.nombre?'«'+S.familia.nombre+'» en ':'nuestra lista de la compra en '}FotoCesta.\n1) Instala la app: https://github.com/tonisanchezdela/fotocesta/releases/latest/download/FotoCesta.apk\n2) Pulsa «Tengo un código» y escribe: ${FAM}`}
function hojaCodigo(nueva){
  const fam=S.familia?.nombre||'Tu familia';
  const orden=Object.entries(S.miembros).sort((a,b)=>(a[0]===yo?.uid?-1:b[0]===yo?.uid?1:(a[1].unido||0)-(b[1].unido||0)));
  openSheet(`<p class="note" style="margin:0">${nueva?'¡Familia creada!':'Familia'}</p>
  <div class="famTit"><h2 style="margin:0">${esc(fam)}</h2><button class="btn line" data-act="famRen">Cambiar nombre</button></div>
  <p class="note">Comparte este código con tu familia. Cada uno instala la app, pulsa «Tengo un código» y lo escribe.</p>
  <div class="codigo num">${esc(FAM)}</div>
  <div class="actions"><button class="btn" data-act="famCompartir">Enviar invitación</button><button class="btn ghost" data-act="famCopiar">Copiar código</button></div>
  <h3>Miembros (${orden.length})</h3><div class="miembros">${orden.map(([uid,m])=>`<div class="mb">${avatar(uid,44,true)}<span style="flex:1">${esc(m.nombre||'')}${uid===yo?.uid?' <small style="color:var(--muted)">(tú)</small>':''}</span><button class="btn line mbEd" data-act="${uid===yo?.uid?'perfil':'mbEditar'}" data-u="${esc(uid)}">Editar</button></div>`).join('')||'<p class="note">Solo tú, de momento.</p>'}</div>
  <div class="actions"><button class="btn line" data-act="cerrar">Hecho</button></div>`);
}
function hojaListas(){
  const ids=Object.keys(S.listas).sort((a,b)=>(S.listas[a].creada||0)-(S.listas[b].creada||0));
  openSheet(`<h2>Listas de la familia</h2>
  <div class="opciones">${ids.map(id=>`<div class="lrow ${id===LISTA?'on':''}"><button class="opcion" data-act="listaSel" data-l="${id}"><b>${esc(S.listas[id].nombre)}</b><small>${id===LISTA?'Abierta ahora':'Abrir'}</small></button><button class="btn line" data-act="listaRen" data-l="${id}">Renombrar</button><button class="btn line" style="color:var(--danger)" data-act="listaDel" data-l="${id}">Borrar</button></div>`).join('')}</div>
  <label class="lbl" for="nl-nom" style="margin-top:14px">Nueva lista</label>
  <div class="add" style="margin-top:6px"><input class="field" id="nl-nom" placeholder="Ej. Cumpleaños de Lucía" autocomplete="off"><button class="btn" data-act="listaNueva">Crear</button></div>
  <div class="actions"><button class="btn line" data-act="cerrar">Cerrar</button></div>`);
}

/* ---------- ajustes y copia ---------- */
function abrirAjustes(){
  openSheet(`<h2>Ajustes</h2>
  <h3>Familia</h3>
  ${FAM?`<div class="mb" style="margin-bottom:8px">${avatar(yo?.uid,40)}<span>${esc(miembro(yo?.uid)?.nombre||'')} · ${esc(S.familia?.nombre||'familia')} <b class="num">${esc(FAM)}</b></span></div><div class="actions"><button class="btn ghost" data-act="famVer">Invitar / ver miembros</button><button class="btn ghost" data-act="perfil">Cambiar nombre o foto</button></div><div class="actions"><button class="btn line" style="color:var(--danger)" data-act="famSalir">Salir de la familia</button></div>`:`<p class="note">Comparte las listas con tu familia: todos añadís a la vez.</p><div class="actions"><button class="btn" data-act="famCrear">Crear familia</button><button class="btn ghost" data-act="famUnir">Tengo un código</button></div>`}
  <h3>Copia de seguridad</h3>
  <p class="note">Tus listas, precios y hábitos se guardan en este móvil. Haz una copia para pasarlos a otro móvil o no perderlos si borras el navegador.</p>
  <div class="actions"><button class="btn ghost" data-act="exportar">Descargar copia</button><button class="btn ghost" data-act="importar">Cargar copia</button></div>
  <div class="actions"><button class="btn line" style="color:var(--danger)" data-act="borrarTodo">Borrar todos los datos</button></div>
  <p class="note" style="margin-top:18px"><a href="https://github.com/tonisanchezdela/fotocesta/blob/main/PRIVACIDAD.md" style="color:var(--accent)">Política de privacidad</a></p>`);
}
function exportar(){
  if(NATIVO){window.Android.guardar('fotocesta-copia-'+hoy()+'.json',JSON.stringify({app:'FotoCesta',v:1,fecha:hoy(),datos:S},null,1));return}
  const blob=new Blob([JSON.stringify({app:'FotoCesta',v:1,fecha:hoy(),datos:S},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fotocesta-copia-'+hoy()+'.json';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
$('#imp').addEventListener('change',async e=>{
  const f=e.target.files?.[0];e.target.value='';if(!f)return;
  try{const d=JSON.parse(await f.text());if(d?.app!=='FotoCesta'||!d.datos)throw 0;
    for(const k in S)S[k]=d.datos[k]||{};saveLocal();closeSheet();render();toast('Copia cargada.')}
  catch{toast('Ese archivo no es una copia de FotoCesta.')}
});


window.__atras=()=>{
  if(!$('#busy').hidden)return true;
  if(!$('#sheet').hidden){closeSheet();cola=[];return true}
  if(tab!=='lista'){document.querySelector('[data-tab=lista]').click();return true}
  return false;
};

/* ---------- hojas ---------- */
function openSheet(html){$('#sheetBody').innerHTML=html;$('#sheet').hidden=false}
function closeSheet(){$('#sheet').hidden=true;$('#sheetBody').innerHTML=''}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
let tt=0;function toast(m,acts){const t=$('#toast');t.textContent=m;(acts||[]).filter(Boolean).forEach(([l,a])=>{const b=document.createElement('button');b.textContent=l;b.dataset.act=a;t.appendChild(b)});t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,acts?6000:3500)}



function irA(v){tab=v;document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===v?'page':'false'));['lista','presu','habitos'].forEach(k=>$('#v-'+k).hidden=k!==v);scrollTo(0,0)}
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-tab],[data-act]');if(!t)return;
  if(t.dataset.tab){irA(t.dataset.tab);return}
  const a=t.dataset.act,id=t.dataset.id,x=id&&S.lista[id];
  switch(a){
    case'cerrar':closeSheet();break;
    case'tog':if(x)put('lista',id,{...x,marcado:!x.marcado});break;
    case'inc':if(x)put('lista',id,{...x,cant:(x.cant||1)+1});break;
    case'dec':if(x){if((x.cant||1)<=1)del('lista',id);else put('lista',id,{...x,cant:x.cant-1})}break;
    case'rm':if(x)del('lista',id);break;
    case'sugAdd':{const p=S.productos[id];if(!p)break;const nom=await anadirALista([{e:matchCat(p.nombre)&&toks(matchCat(p.nombre).n)===toks(p.nombre)?matchCat(p.nombre):null,nombre:p.nombre,cant:+t.dataset.c||1}],'habito');toast('Añadido: '+nom.join(', '),[['Deshacer','deshacer']]);break}
    case'qVoz':escuchar();break;
    case'dictOk':{const v=$('#dict-txt').value.trim();closeSheet();const ps=parseVoz(v);if(ps.length)await procesarEntradas(ps,'voz');break}
    case'deshacer':$('#toast').hidden=true;deshacerUltimo();break;
    case'opInc':{const s=$('#opCant');s.textContent=(+s.textContent||1)+1;break}
    case'opDec':{const s=$('#opCant');s.textContent=Math.max(1,(+s.textContent||1)-1);break}
    case'opElegir':elegirOpcion(+t.dataset.i);break;
    case'opLibre':elegirOpcion(null,true);break;
    case'opSaltar':elegirOpcion(null,false);break;
    case'confirmar':irA('presu');break;
    case'ajustes':abrirAjustes();break;
    case'exportar':exportar();break;
    case'importar':$('#imp').click();break;
    case'borrarTodo':if(t.dataset.ok){for(const k in S)S[k]={};saveLocal();closeSheet();render();toast('Datos borrados.')}else{t.dataset.ok='1';t.textContent='Pulsa otra vez para confirmar'}break;
    case'supTog':{const cur=S.ajustes.general?.supers||SUPERS.map(s=>s.id);const s=t.dataset.s;
      const nx=cur.includes(s)?cur.filter(v=>v!==s):[...cur,s];if(!nx.length){toast('Deja al menos un súper.');break}
      put('ajustes','general',{supers:nx});break}
    case'precio':{const p=S.productos[id];if(!p)break;const sup=t.dataset.s||'mercadona';const cur=priceInfo(id,sup);
      openSheet(`<h2>Precio de ${esc(p.nombre)}</h2><p class="note">Pon lo que cuesta en un súper. Se guarda y se usa en los próximos presupuestos.</p>
      <div style="display:grid;grid-template-columns:1fr 110px;gap:8px"><select class="field" id="pm-sup">${SUPERS.map(s=>`<option value="${s.id}" ${sup===s.id?'selected':''}>${s.n}</option>`).join('')}</select>
      <input class="field" id="pm-p" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00 €" value="${cur&&cur.src!=='est'?String(cur.p).replace('.',','):''}"></div>
      <div class="actions"><button class="btn" data-act="pmSave" data-id="${id}">Guardar precio</button><button class="btn line" data-act="cerrar">Cancelar</button></div>`);break}
    case'pmSave':{const v=parseFloat(String($('#pm-p').value).replace(',','.'));if(!(v>0)){toast('Escribe un precio.');break}
      const p=clone(S.productos[id]);p.precios=p.precios||{};p.precios[$('#pm-sup').value]={p:Math.round(v*100)/100,src:'ticket',f:hoy()};
      closeSheet();put('productos',id,p);toast('Precio guardado.');break}
    case'terminar':openSheet(`<h2>¿Dónde has comprado?</h2><p class="note">Apunto la compra en tus hábitos y vacío el carro.</p>
      <div class="chips">${SUPERS.map(s=>`<button class="chip" data-act="fin" data-s="${s.id}">${s.n}</button>`).join('')}</div>
      <div class="actions"><button class="btn line" data-act="cerrar">Cancelar</button></div>`);break;
    case'fin':terminarCompra(t.dataset.s);break;
    case'bienvenida':hojaBienvenida();break;
    case'famCrear':hojaPerfil('crear');break;
    case'famUnir':hojaPerfil('unir');break;
    case'famSolo':lsSet(SOLO_KEY,1);closeSheet();break;
    case'perfil':hojaPerfil('editar');break;
    case'pfElegirFoto':$('#fotoPerfil').click();break;
    case'pfGuardar':guardarPerfil(t.dataset.m,t.dataset.u);break;
    case'mbEditar':hojaPerfil('miembro',t.dataset.u);break;
    case'pfQuitarFoto':{perfilFoto='';const p=$('#pf-prev');if(p)p.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';t.remove();break}
    case'famQuitar':if(t.dataset.ok){const u=t.dataset.u;famRef().collection('miembros').doc(u).delete().catch(avisoError);delete S.miembros[u];hojaCodigo(false);toast('Miembro quitado de la familia.')}else{t.dataset.ok='1';t.textContent='Pulsa otra vez para quitarlo'}break;
    case'famRen':openSheet(`<h2>Nombre de la familia</h2><input class="field big" id="fn-nom" autocomplete="off" value="${esc(S.familia?.nombre||'')}" placeholder="Ej. Familia Sánchez"><div class="actions"><button class="btn" data-act="famRenOk">Guardar</button><button class="btn line" data-act="famVer">Volver</button></div>`);setTimeout(()=>$('#fn-nom')?.focus(),60);break;
    case'famRenOk':{const n=$('#fn-nom').value.trim();if(!n){toast('Escribe un nombre.');break}famRef().update({nombre:n}).catch(avisoError);S.familia={...S.familia,nombre:n};hojaCodigo(false);render();break}
    case'famVer':hojaCodigo(false);break;
    case'famCopiar':try{await navigator.clipboard.writeText(FAM);toast('Código copiado.')}catch{toast('Código: '+FAM)}break;
    case'famCompartir':if(NATIVO&&window.Android.compartir)window.Android.compartir(textoInvitacion());else if(navigator.share)navigator.share({text:textoInvitacion()}).catch(()=>{});else{try{await navigator.clipboard.writeText(textoInvitacion());toast('Invitación copiada: pégala en WhatsApp.')}catch{toast('Código: '+FAM)}}break;
    case'famSalir':if(t.dataset.ok){closeSheet();await salirFamilia();toast('Has salido de la familia.')}else{t.dataset.ok='1';t.textContent='Pulsa otra vez para salir'}break;
    case'listas':hojaListas();break;
    case'listaSel':cambiarLista(t.dataset.l);closeSheet();break;
    case'listaNueva':{const n=$('#nl-nom').value.trim();if(!n){toast('Escribe el nombre de la lista.');break}crearLista(n);closeSheet();toast('Lista «'+n+'» creada.');break}
    case'listaRen':{const l=t.dataset.l;openSheet(`<h2>Renombrar lista</h2><input class="field big" id="rl-nom" value="${esc(S.listas[l]?.nombre||'')}"><div class="actions"><button class="btn" data-act="listaRenOk" data-l="${l}">Guardar</button><button class="btn line" data-act="listas">Volver</button></div>`);break}
    case'listaRenOk':{const l=t.dataset.l,n=$('#rl-nom').value.trim();if(!n)break;famRef().collection('listas').doc(l).update({nombre:n}).catch(avisoError);S.listas[l]={...S.listas[l],nombre:n};hojaListas();break}
    case'listaDel':if(t.dataset.ok){await borrarLista(t.dataset.l);hojaListas();toast('Lista borrada.')}else{t.dataset.ok='1';t.textContent='¿Seguro?'}break;
  }
});

$('#fotoPerfil').addEventListener('change',async e=>{const f=e.target.files?.[0];e.target.value='';if(!f)return;try{perfilFoto=await fotoAvatar(f);const p=$('#pf-prev');if(p)p.innerHTML=`<img src="${perfilFoto}" alt="">`}catch{toast('No he podido abrir esa foto.')}});
$('#catlist').innerHTML=CATALOGO.map(r=>`<option value="${esc(r[0])}">`).join('');
if(!NATIVO&&'serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
(async()=>{
  if(lsGet(FAM_KEY)){render();await arrancarFamilia()}
  else{loadLocal();render();if(!lsGet(SOLO_KEY))hojaBienvenida()}
})();
</script>
</body></html>
