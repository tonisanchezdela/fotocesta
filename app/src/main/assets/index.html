<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2C7A4B">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>FotoCesta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
html{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{
  --bg:#F1F5EF;--surface:#FFFFFF;--ink:#15211A;--muted:#5C6A60;--line:#D9E2D6;
  --accent:#2C7A4B;--accent-soft:#E0EFE4;--accent-ink:#FFFFFF;
  --warm:#C8651A;--warm-soft:#FBEBDD;--paper:#FFFFFF;--danger:#B3372B;
  --shadow:0 8px 28px rgba(21,33,26,.14);
  --f-disp:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0F1511;--surface:#18211B;--ink:#E5EEE7;--muted:#93A298;--line:#2A362E;
  --accent:#5CBD80;--accent-soft:#1F3527;--accent-ink:#0F1511;--warm:#EFA052;--warm-soft:#3A2A1B;--paper:#1C261F;--danger:#EE7B6E;
  --shadow:0 8px 28px rgba(0,0,0,.5);}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0F1511;--surface:#18211B;--ink:#E5EEE7;--muted:#93A298;--line:#2A362E;
  --accent:#5CBD80;--accent-soft:#1F3527;--accent-ink:#0F1511;--warm:#EFA052;--warm-soft:#3A2A1B;--paper:#1C261F;--danger:#EE7B6E;
  --shadow:0 8px 28px rgba(0,0,0,.5);}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 190px}

/* cabecera */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.brand{font:800 26px/1 var(--f-disp);letter-spacing:-.02em}
.brand span{color:var(--accent)}
.hr{display:flex;align-items:flex-end;gap:10px}
.gear{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;color:var(--muted)}
.gear svg{width:20px;height:20px}
.est{text-align:right}
.est small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.est b{font:600 20px/1.1 var(--f-mono);color:var(--warm)}
.est em{font-style:normal;font-size:12px;color:var(--muted)}

h2{font:700 19px/1.2 var(--f-disp);margin:22px 0 10px;text-wrap:balance}
h3{font:600 12px/1 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
p.note{color:var(--muted);font-size:13px;margin:6px 0}

/* añadir manual */
.add{display:flex;gap:8px;margin-top:14px}
.add input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 12px;font:inherit}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.line{background:transparent;border:1px solid var(--line)}
.btn:disabled{opacity:.5}

/* sugerencias */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px dashed var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chip.on{background:var(--accent);color:var(--accent-ink);border-style:solid}
.chip.off{border-color:var(--line);color:var(--muted);border-style:solid}

/* lista */
ul.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:32px 1fr auto 28px;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;font-size:14px;color:transparent}
.done .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.done .nm b{text-decoration:line-through;color:var(--muted)}
.nm{min-width:0}
.nm b{font-weight:600;display:block;overflow-wrap:anywhere}
.nm small{color:var(--muted);font-size:12px}
.nm small .pr{color:var(--warm);font-family:var(--f-mono)}
.qty{display:flex;align-items:center;gap:2px;background:var(--bg);border-radius:10px}
.qty button{border:0;background:transparent;width:30px;height:30px;font-size:18px;font-weight:600}
.qty span{min-width:18px;text-align:center;font-family:var(--f-mono)}
.lk{border:0;background:none;padding:0;color:var(--accent);font-size:12px;font-weight:600;text-decoration:underline}
.x{border:0;background:transparent;color:var(--muted);font-size:20px;width:28px;height:28px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:18px;display:grid;gap:12px}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mode{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:left;display:grid;gap:4px}
.mode b{font:700 15px/1.2 var(--f-disp)}
.mode span{font-size:12.5px;color:var(--muted)}
.mode svg{width:26px;height:26px;color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* ticket / presupuesto */
.ticket{background:var(--paper);border:1px solid var(--line);border-radius:4px 4px 0 0;padding:16px 16px 22px;position:relative;font-family:var(--f-mono);
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/16px 8px repeat-x;
  mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/16px 8px repeat-x}
.ticket .hd{text-align:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-bottom:1px dashed var(--line);padding-bottom:10px;margin-bottom:10px}
.bar{display:grid;grid-template-columns:96px 1fr 76px;align-items:center;gap:8px;padding:6px 0;font-size:13px}
.bar .n{font-family:var(--f-body);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;background:var(--muted);opacity:.45;border-radius:5px}
.bar.best .fill{background:var(--accent);opacity:1}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}
.bar.best .v{color:var(--accent);font-weight:600}
.bar .flag{grid-column:2/4;font-size:11px;color:var(--muted);font-family:var(--f-body);margin-top:-4px}
.pick{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;font-family:var(--f-body);display:grid;gap:4px}
.pick b{font:700 17px/1.2 var(--f-disp)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td{padding:8px 4px;border-top:1px solid var(--line);vertical-align:top}
.tbl td:last-child{text-align:right;white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:5px}
.tag.real{background:var(--accent-soft);color:var(--accent)}
.tag.est{background:var(--warm-soft);color:var(--warm)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}

/* hábitos */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{font:600 20px/1.2 var(--f-mono)}
.sug{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.sug:first-child{border-top:0}
.sug small{display:block;color:var(--muted);font-size:12px}
.rank{display:grid;grid-template-columns:1fr auto;gap:6px;font-size:14px;padding:6px 0;border-top:1px solid var(--line)}
.rank:first-child{border-top:0}

/* barra inferior */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center}
.quick{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 16px 4px}
.qb{border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);padding:12px 4px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px}
.qb svg{width:24px;height:24px;flex:none}
#qVoz{background:var(--warm)}
#qVoz.on{animation:pulso 1s ease-in-out infinite}
@keyframes pulso{50%{transform:scale(1.06);opacity:.85}}
.cam{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam.flash::after{content:"";position:absolute;inset:0;background:#fff;opacity:.7}
.camTop{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;color:#fff;background:linear-gradient(#000a,#0000);font:700 18px var(--f-disp)}
.camX{border:0;background:#0006;color:#fff;width:44px;height:44px;border-radius:50%;font-size:28px;line-height:1}
.camHint{position:relative;color:#fff;background:#0008;padding:6px 12px;border-radius:10px;font-size:14px;margin:0 16px 16px}
.shutter{position:relative;width:84px;height:84px;border-radius:50%;border:6px solid #fff;background:#fff5;margin-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.shutter:active{background:#fff}
.vozTxt{position:fixed;left:16px;right:16px;bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:31;background:var(--warm);color:#fff;font:600 18px var(--f-body);padding:14px 16px;border-radius:14px;text-align:center}
.tab{border:0;background:transparent;padding:10px 4px 12px;font-size:12px;font-weight:600;color:var(--muted);display:grid;justify-items:center;gap:3px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.fab{justify-self:center;width:64px;height:64px;border-radius:50%;border:4px solid var(--bg);background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-26px;box-shadow:var(--shadow)}
.fab svg{width:28px;height:28px}

/* hojas y avisos */
.sheet{position:fixed;inset:0;z-index:10;background:rgba(10,16,12,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .body{background:var(--surface);width:100%;max-width:560px;max-height:86%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin-top:0}
.rv{display:grid;grid-template-columns:24px 1fr 64px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.rv input[type=text],.rv input[type=number],.field{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 8px;font:inherit}
.rv small{grid-column:2/4;color:var(--muted);font-size:12px;margin-top:-4px}
.busy{position:fixed;inset:0;z-index:20;background:rgba(10,16,12,.55);display:grid;place-items:center;padding:16px}
.busy .b{background:var(--surface);border-radius:18px;padding:22px;max-width:320px;width:100%;display:grid;gap:14px;justify-items:center;text-align:center}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--accent-soft);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.toast button{border:0;background:none;color:var(--accent);font-weight:700;padding:4px 2px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:30;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px)}
</style>
</head><body>
<div class="wrap">
  <header>
    <div class="brand">Foto<span>Cesta</span></div>
    <div class="hr"><div class="est" id="est"></div><button class="gear" data-act="ajustes" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
  </header>

  <main id="v-lista"></main>
  <main id="v-presu" hidden></main>
  <main id="v-habitos" hidden></main>
</div>

<nav>
<div class="quick">
  <button class="qb" id="qProd" data-act="qProducto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Producto</button>
  <button class="qb" id="qNev" data-act="qNevera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M5 10h14M9 5v2M9 13v3"/></svg>Nevera</button>
  <button class="qb" id="qVoz" data-act="qVoz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Voz</button>
</div>
<div class="in">
  <button class="tab" data-tab="lista" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>Lista</button>
  <button class="tab" data-tab="presu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Presupuesto</button>
  <button class="tab" data-tab="habitos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10M10 19V5M16 19v-7M22 19H2"/></svg>Hábitos</button>
</div></nav>
<div class="cam" id="cam" hidden>
  <video id="camVid" playsinline muted></video>
  <div class="camTop"><b id="camTit">Producto</b><button class="camX" data-act="camCerrar" aria-label="Cerrar">×</button></div>
  <p class="camHint">Apunta a las letras grandes del producto y pulsa</p>
  <button class="shutter" data-act="disparar" aria-label="Hacer foto"></button>
</div>
<div class="vozTxt" id="vozTxt" hidden></div>

<input type="file" id="foto" accept="image/*" multiple hidden>
<input type="file" id="fotoCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fotoRapida" accept="image/*" capture="environment" hidden>
<datalist id="catlist"></datalist>
<input type="file" id="imp" accept="application/json,.json" hidden>
<div class="sheet" id="sheet" hidden><div class="body" id="sheetBody"></div></div>
<div class="busy" id="busy" hidden><div class="b"><div class="spin"></div><div id="busyMsg"></div><button class="btn line" data-act="parar">Cancelar</button></div></div>
<div class="toast" id="toast" hidden></div>

<script>
const SUPERS=[
  {id:'mercadona',n:'Mercadona'},{id:'consum',n:'Consum'},{id:'lidl',n:'Lidl'},
  {id:'carrefour',n:'Carrefour'},{id:'alcampo',n:'Alcampo'},{id:'dia',n:'Dia'},{id:'familycash',n:'Family Cash'}];
const SN=Object.fromEntries(SUPERS.map(s=>[s.id,s.n]));
const CATS=['Frutas y verduras','Carne y pescado','Lácteos y huevos','Panadería','Despensa','Congelados','Bebidas','Limpieza','Higiene','Mascotas','Otros'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur=n=>n==null||isNaN(n)?'—':n.toLocaleString('es-ES',{style:'currency',currency:'EUR'});
const slug=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,80)||'item';
const clone=o=>JSON.parse(JSON.stringify(o||{}));
const hoy=()=>new Date().toISOString().slice(0,10);
const DAY=864e5;
const dias=f=>Math.round((Date.now()-new Date(f).getTime())/DAY);

/* ---------- datos ---------- */
const S={productos:{},lista:{},tickets:{},ajustes:{}};
let db=null;
const LS='fotocesta-v1';
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(d)for(const k in S)S[k]=d[k]||{}}catch{}}
function saveLocal(){if(db)return;try{localStorage.setItem(LS,JSON.stringify(S))}catch{}}
const chains={};
function queue(k,fn){const p=(chains[k]||Promise.resolve()).then(fn).catch(e=>toast('No se ha guardado: '+(e?.code||'error')));chains[k]=p;return p}
function put(col,id,data){S[col][id]=data;scheduleRender();if(!db){saveLocal();return Promise.resolve()}return queue(col+'/'+id,()=>db.doc(col+'/'+id).set(data))}
function del(col,id){delete S[col][id];scheduleRender();if(!db){saveLocal();return Promise.resolve()}return queue(col+'/'+id,()=>db.doc(col+'/'+id).delete())}
/* ---------- catálogo y precios de referencia ---------- */
const PRECIOS_FECHA='26/09/2026';
/* Índice de cada cadena respecto a Mercadona. Mercadona, Alcampo, Dia y Carrefour: cesta básica de RadarSuper (26/09/2026).
   Lidl, Consum y Family Cash no salen en RadarSuper: índice estimado. */
const IDX={mercadona:1,alcampo:0.88,dia:0.89,carrefour:1.28,lidl:0.95,consum:1.05,familycash:0.93};

function lev(a,b,max){

/* Marcas: si en la foto pone una marca (Actimel, Puleva, Fairy…) devuelve sus artículos, el más parecido primero */
function marcasDeTexto(o){
  const full=' '+o.text.split('\n').join(' | ')+' '+[...o.words].map(w=>w.t).join(' ')+' ';
  const found=new Map();
  for(const e of CAT_IDX){if(!e.m)continue;
    for(const k of e.kw){if(k.length<3)continue;if(full.includes(' '+k+' ')){const cur=found.get(e.m)||{m:e.m,best:null,bl:0};if(k.length>cur.bl){cur.best=e;cur.bl=k.length}found.set(e.m,cur)}}}
  const alto=m=>{let h=0;for(const e of CAT_IDX)if(e.m===m)for(const k of e.kw)for(const t of k.split(' ')){const w=o.words.find(x=>x.t===t);if(w&&w.h>h)h=w.h}return h};
  const out=[];
  for(const {m,best} of [...found.values()].sort((a,b)=>alto(b.m)-alto(a.m))){
    const arts=CAT_IDX.filter(e=>e.m===m);arts.sort((a,b)=>(b===best)-(a===best));
    arts.slice(0,6).forEach((e,i)=>out.push({e,leido:m,marca:m,principal:i===0}));
  }
  return out;
}
/* Busca en el catálogo a partir de las letras más grandes (lo más evidente) y después del resto del texto */
function productosDeTexto(o,max=3){
  const out=[],vistos=new Set();
  const add=(e,leido,extra)=>{if(e&&!vistos.has(e.n)){vistos.add(e.n);out.push({e,leido,...extra})}};
  for(const x of marcasDeTexto(o))add(x.e,x.leido,{marca:x.marca,principal:x.principal});
  const nMarca=out.length;
  const grandes=[...o.words].sort((a,b)=>b.h-a.h);
  const top=grandes.slice(0,6).sort((a,b)=>a.y-b.y||a.x-b.x);
  add(matchCat(top.map(w=>w.t).join(' ')),top.map(w=>w.raw||w.t).join(' '));
  for(const l of o.text.split(/\n+/)){const t=l.trim();if(t.length>=3)add(matchCat(t),t)}
  for(let i=0;i<top.length-1;i++){const f=top[i].t+' '+top[i+1].t;add(matchCat(f),f)}
  for(const w of grandes.slice(0,12))add(matchCat(w.t),w.raw||w.t);

}

function parseTicket(text){
  const T=text.toUpperCase();
  const SK=[['mercadona',/MERCADONA/],['consum',/CONSUM/],['lidl',/LIDL/],['carrefour',/CARREFOUR/],['alcampo',/ALCAMPO|AUCHAN/],['familycash',/FAMILY/],['dia',/\bDIA\b|DIA RETAIL/]];
  const sup=(SK.find(([,r])=>r.test(T))||[])[0]||null;
  let fecha=null;const fm=T.match(/(\d{2})[\/\-.](\d{2})[\/\-.](\d{2,4})/);
  if(fm){const y=fm[3].length===2?'20'+fm[3]:fm[3];if(+fm[2]<=12&&+fm[1]<=31)fecha=`${y}-${fm[2]}-${fm[1]}`}
  const PR=/-?\d{1,4}[.,]\d{2}(?!\d)/g;
  const SKIP=/TOTAL|IVA|TARJETA|CAMBIO|ENTREGAD|EFECTIVO|BASE IMP|CUOTA|SUBTOTAL|IMPORTE|FACTURA|N\.?I\.?F|C\.?I\.?F|TEL[EÉ]F|DESCUENTO|AHORRO|PUNTOS|OPERACI|VISA|MASTER|FECHA|HORA|CAJA|TICKET|DEVOLUC|GRACIAS|BOLSA|APLAZ|AUTORIZ|CONTACTLESS|PAGO/;
  const lineas=[];let total=null,pend=null;
  for(const raw of text.split(/\n+/)){
    const L=raw.toUpperCase();
    const ps=[...raw.matchAll(PR)].map(m=>parseFloat(m[0].replace(',','.')));
    if(/TOTAL/.test(L)&&ps.length){total=ps[ps.length-1];continue}
    if(SKIP.test(L))continue;
    let nom=raw.replace(PR,' ').replace(/€|EUR|\/\s*KG|\bKG\b|\bUDS?\b|\bUN\b/gi,' ');
    let cant=1;const q=nom.trim().match(/^(\d{1,2})\s+(.+)$/);if(q){cant=+q[1];nom=q[2]}
    nom=nom.replace(/[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ ]/g,' ').replace(/\s+/g,' ').trim();
    if(!ps.length){pend=nom.length>=3?nom:null;continue}
    if(/KG/.test(L)&&nom.length<3&&pend){nom=pend;cant=1}
    if(nom.replace(/\s/g,'').length<3)continue;
    const tot=ps[ps.length-1];if(!(tot>0))continue;
    const unit=ps.length>=2&&cant>1?ps[0]:tot/cant;
    pend=null;
    const e=matchCat(nom);
    lineas.push({nombre:genName(nom),cant,precio_unit:Math.round(unit*100)/100,cat:e?.c||'Otros',match:e?e.n:null,leido:nom});
  }
  return{super:sup,fecha,total,lineas};
}

function activeSupers(){const a=S.ajustes.general?.supers;return SUPERS.filter(s=>!a||a.includes(s.id))}
function priceInfo(id,sup){
  const p=S.productos[id];const v=p?.precios?.[sup];
  if(v&&v.p>0)return{p:v.p,src:v.src==='web'?'web':'ticket'};
  const e=matchCat(p?.nombre);if(e)return{p:Math.round(e.p*IDX[sup]*100)/100,src:'est'};

}
function priceOf(id,sup){return priceInfo(id,sup)?.p??null}
function avgPrice(id){const v=SUPERS.map(s=>priceOf(id,s.id)).filter(n=>n>0);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}
function cheapest(id){let best=null;for(const s of activeSupers()){const i=priceInfo(id,s.id);if(i&&(!best||i.p<best.p))best={sup:s.id,...i}}return best}
function budget(){
  const items=Object.entries(S.lista).filter(([,x])=>!x.marcado);
  const sups=activeSupers();
  const sinPrecio=items.filter(([id])=>avgPrice(id)==null).length;
  const cost=(id,sup)=>priceOf(id,sup)??avgPrice(id);
  const per=sups.map(s=>{let t=0,miss=0;for(const [id,x] of items){const i=priceInfo(id,s.id);const p=i?i.p:avgPrice(id);if(p==null)continue;if(!i||i.src==='est')miss++;t+=p*(x.cant||1)}return{s,t,miss}}).sort((a,b)=>a.t-b.t);
  let pair=null;
  for(let i=0;i<sups.length;i++)for(let j=i+1;j<sups.length;j++){
    let t=0;const a=sups[i].id,b=sups[j].id;
    for(const [id,x] of items){const pa=cost(id,a),pb=cost(id,b);if(pa==null)continue;t+=Math.min(pa,pb)*(x.cant||1)}
    if(!pair||t<pair.t)pair={a,b,t};
  }
  return{items,per,pair,sinPrecio};
}

async function reconocer(file,grid){
  await loadClip();
  const im=await loadImg(file);
  const cs=recortes(im,grid);const best={};
  for(let k=0;k<cs.length;k++){
    if(cancelado)return [];
    busy(grid?`Mirando la foto… zona ${k+1} de ${cs.length}`:'Reconociendo el producto…');
    const r=await clasificar(cs[k]);
    for(const x of r.slice(0,grid?1:3)){const n=VIS[x.i][0];if(!n)continue;if(!best[n]||x.p>best[n])best[n]=x.p}
  }
  return Object.entries(best).map(([n,p])=>({n,p})).sort((a,b)=>b.p-a.p);
}

const pct=p=>Math.round(p*100)+' %';

async function onPhotos(files){
  if(!files.length)return;
  const m=modoActual;closeSheet();
  cancelado=false;ctl={abort(){cancelado=true;busy()}};
  busy(MODOS[m].msg);
  try{
    if(m==='producto'){
      const items=[],leidos=[];
      for(const f of files){if(cancelado)return;
        busy('Buscando código de barras…');
        const code=await leerCodigo(f);
        if(code){busy('Consultando el producto '+code+'…');const off=await buscarOFF(code);
          if(off){const e=matchCat(off.nombre);items.push({nombre:e?e.n:off.nombre,cat:e?.c,cant:1,motivo:'Código: '+[off.nombre,off.marca,off.formato].filter(Boolean).join(' · ')+refTxt(e?e.n:off.nombre)});continue}}
        let o=await ocrWords(f,0);if(cancelado)return;
        let hall=productosDeTexto(o,4);
        if(!hall.length){o=await ocrWords(f,90);if(cancelado)return;hall=productosDeTexto(o,4)}
        palabrasGrandes(o).forEach(w=>{if(!leidos.includes(w))leidos.push(w)});
        if(hall.length){hall.forEach((x,i)=>items.push({nombre:x.e.n,cat:x.e.c,cant:1,ok:i===0,motivo:(x.marca?(x.principal?'Leído: «'+x.marca+'»':'Otro artículo de '+x.marca):(i===0?'Leído: ':'¿O es…? Leído: ')+'«'+x.leido.slice(0,40)+'»')+(x.e.f?' · '+x.e.f:'')+refTxt(x.e.n)}));continue}
        const r=await reconocer(f,false);if(cancelado)return;
        r.slice(0,3).forEach((x,i)=>items.push({nombre:x.n,cant:1,ok:i===0&&x.p>=0.25,motivo:(i===0?'Por su aspecto: ':'¿O es…? ')+pct(x.p)+refTxt(x.n)}));
      }
      if(cancelado)return;
      showReview(items,m,leidos);
    }else if(m==='nevera'){
      const vistos={};
      for(const f of files){if(cancelado)return;for(const x of await reconocer(f,true))if(x.p>=0.30&&(!vistos[x.n]||x.p>vistos[x.n]))vistos[x.n]=x.p}
      for(const f of files){if(cancelado)return;const o=await ocrWords(f,0);for(const x of productosDeTexto(o,20))if(!vistos[x.e.n])vistos[x.e.n]=0.99}
      if(cancelado)return;
      const vistosN=new Set(Object.keys(vistos).map(slug));
      const faltan=sugerencias().filter(s=>!vistosN.has(s.id)).map(s=>({nombre:s.nombre,cant:s.cant,ok:true,motivo:'Sueles comprarlo y no lo veo en la foto'}));
      const habit=new Set(Object.values(S.productos).filter(p=>(p.compras||[]).length>=2).map(p=>slug(p.nombre)));
      const noVistosHab=[...habit].filter(id=>!vistosN.has(id)&&!faltan.some(f=>slug(f.nombre)===id)&&!S.lista[id]).map(id=>({nombre:S.productos[id].nombre,cant:1,ok:false,motivo:'Sueles comprarlo y no lo veo en la foto'}));
      const veo=Object.entries(vistos).sort((a,b)=>b[1]-a[1]).map(([n,p])=>({nombre:n,cant:1,ok:false,motivo:(p>=0.99?'Leo su etiqueta en la foto':'Lo veo en la foto ('+pct(p)+')')+'. Márcalo si se está acabando'+refTxt(n)}));
      const items=[...faltan,...noVistosHab,...veo];
      if(!items.length){toast('No he reconocido productos. Haz la foto más cerca y con buena luz.');return}
      showReview(items,m);
    }else{
      let txt='';for(const f of files){if(cancelado)return;txt+='\n'+await ocr(f)}
      if(cancelado)return;
      if(m==='ticket')showTicket(parseTicket(txt));
      else showReview(parseLista(txt),m);
    }
  }catch(e){if(!cancelado)toast(errMsg(e))}
  finally{ctl=null;busy()}
}

  revM=m;revLeidos=leidos||[];
  if(!review.length&&!revLeidos.length){toast('No he encontrado productos en la foto.');return}
  pintaReview();
}

  <div class="actions"><button class="btn" data-act="tkSave">Guardar ticket</button><button class="btn line" data-act="cerrar">Descartar</button></div>`);

async function saveTicket(){
  const sup=$('#tk-sup').value,fecha=$('#tk-fecha').value||hoy();
  const ls=tk.lineas.map((l,i)=>({ok:$('#tk-ok-'+i).checked,nombre:$('#tk-n-'+i).value.trim(),cant:+$('#tk-c-'+i).value||1,pu:+$('#tk-p-'+i).value||0,cat:l.cat})).filter(l=>l.ok&&l.nombre);
  closeSheet();
  for(const l of ls){
    const e=matchCat(l.nombre);const id=slug(l.nombre);
    const p=clone(S.productos[id]||{nombre:l.nombre,cat:e?.c||(CATS.includes(l.cat)?l.cat:'Otros'),precios:{},compras:[],creado:hoy()});
    p.precios=p.precios||{};
    if(l.pu>0)p.precios[sup]={p:Math.round(l.pu*100)/100,src:'ticket',f:fecha};
    p.compras=[...(p.compras||[]),{fecha,cant:l.cant,super:sup,precio:l.pu>0?l.pu:null}].sort((a,b)=>a.fecha<b.fecha?-1:1).slice(-40);
    await put('productos',id,p);
    if(S.lista[id])await del('lista',id);
  }
  await put('tickets','t'+Date.now(),{fecha,super:sup,total:Math.round(tk.total*100)/100,n:ls.length});
  tk=null;
  toast(`Ticket guardado: ${ls.length} productos con precio real.`);
}

let camStream=null,camModo=null;
async function abrirCamara(modo){
  camModo=modo;
  $('#camTit').textContent=modo==='nevera'?'Nevera o despensa':modo==='ticket'?'Ticket':'Producto';$('.camHint').textContent=modo==='ticket'?'Encuadra el ticket entero, recto y con buena luz':modo==='nevera'?'Apunta a la nevera abierta y pulsa':'Apunta a las letras grandes del producto y pulsa';
  try{
    if(!navigator.mediaDevices?.getUserMedia)throw 0;
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    const v=$('#camVid');v.srcObject=camStream;$('#cam').hidden=false;await v.play().catch(()=>{});
  }catch{cerrarCamara();$('#fotoRapida').click()}
}
function cerrarCamara(){if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}$('#cam').hidden=true}
async function disparar(){
  const v=$('#camVid');if(!v.videoWidth)return;
  const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);
  $('#cam').classList.add('flash');setTimeout(()=>$('#cam').classList.remove('flash'),150);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.92));
  cerrarCamara();
  const f=new File([blob],'foto.jpg',{type:'image/jpeg'});
  if(camModo==='ticket'){modoActual='ticket';onPhotos([f])}else procesarRapido(f,camModo);
}
let deshacer=null;
async function anadirRapido(prods,origen){
  const antes={};const nombres=[];
  for(const p of prods){
    const e=matchCat(p.nombre);const nombre=e?e.n:p.nombre;const id=slug(nombre);
    if(!(id in antes))antes[id]=S.lista[id]?clone(S.lista[id]):null;
    if(!S.productos[id])await put('productos',id,{nombre,cat:e?.c||'Otros',formato:e?.f||'',precios:{},compras:[],creado:hoy()});
    const cur=S.lista[id];
    await put('lista',id,{nombre:S.productos[id].nombre,cat:S.productos[id].cat,cant:(cur&&!cur.marcado?(cur.cant||1):0)+(p.cant||1),marcado:false,origen,ts:Date.now()});
    nombres.push(nombre+((p.cant||1)>1?' ×'+p.cant:''));
  }
  deshacer=antes;
  return nombres;
}
async function deshacerUltimo(){
  if(!deshacer)return;
  for(const [id,v] of Object.entries(deshacer)){if(v)await put('lista',id,v);else await del('lista',id)}
  deshacer=null;toast('Deshecho.');
}
let ultAlternativas=null;
async function procesarRapido(file,modo){
  cancelado=false;ctl={abort(){cancelado=true;busy()}};
  try{
    if(modo==='producto'){
      busy('Leyendo el producto…');
      let hall=[];let o=null;
      try{if('BarcodeDetector' in window){const bmp=await createImageBitmap(file);const r=await new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']}).detect(bmp);
        if(r[0]){busy('Consultando el código…');const off=await buscarOFF(r[0].rawValue);if(off){const e=matchCat(off.nombre)||matchCat(off.marca+' '+off.nombre);hall=[{e:e||{n:off.nombre,c:'Otros',f:off.formato},leido:off.nombre}]}}}}catch{}
      if(!hall.length){o=await ocrWords(file,0);if(cancelado)return;hall=productosDeTexto(o,4)}
      if(!hall.length&&!NATIVO){o=await ocrWords(file,90);if(cancelado)return;hall=productosDeTexto(o,4)}
      if(cancelado)return;
      if(!hall.length){
        const pal=o?palabrasGrandes(o):[];
        if(pal.length){showReview([],'producto',pal);toast('No he reconocido el producto. Toca lo que he leído.')}
        else toast('No he podido leer el producto. Acércate a las letras grandes, con buena luz.');
        return;
      }
      const x=hall[0];
      const nom=await anadirRapido([{nombre:x.e.n,cant:1}],'foto');
      ultAlternativas=hall;
      toast('Añadido: '+nom[0]+refTxt(x.e.n),[['Deshacer','deshacer'],hall.length>1?['Cambiar','cambiar']:null]);
    }else{
      const vistos={};
      const o=await ocrWords(file,0);if(cancelado)return;
      for(const x of productosDeTexto(o,20))vistos[x.e.n]=0.99;
      try{for(const x of await reconocer(file,true))if(x.p>=0.30&&!vistos[x.n])vistos[x.n]=x.p}catch{}
      if(cancelado)return;
      const vistosN=new Set(Object.keys(vistos).map(slug));
      const faltan=[];
      for(const p of Object.values(S.productos)){const id=slug(p.nombre);if((p.compras||[]).length>=2&&!vistosN.has(id)&&!S.lista[id])faltan.push({nombre:p.nombre,cant:1})}
      if(faltan.length){const nom=await anadirRapido(faltan,'nevera');toast('Añadido lo que falta: '+nom.join(', '),[['Deshacer','deshacer']]);return}
      const veo=Object.keys(vistos);
      if(veo.length){showReview(veo.map(n=>({nombre:n,cant:1,ok:false,motivo:'Lo veo en la foto. Márcalo si se está acabando'+refTxt(n)})),'nevera');
        toast('Aún no conozco tus hábitos: marca lo que se está acabando.')}
      else toast('No he reconocido nada. Haz la foto más cerca y con buena luz.');
    }
  }catch(e){if(!cancelado)toast(errMsg(e))}
  finally{ctl=null;busy()}
}
/* Voz */
const NUM={un:1,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,docena:12};
function parseVoz(txt){
  return txt.toLowerCase().replace(/\s+(y|e|además|tambien|también|más|mas)\s+/g,',').split(/[,.;]+/).map(t=>t.trim()).filter(Boolean).map(t=>{
    let cant=1;t=t.replace(/^(añade|añadir|apunta|pon|compra|comprar|necesito|quiero)\s+/,'');
    const m=t.match(/^(media docena|una docena|\d+|un|uno|una|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|once|doce)\s+(?:de\s+)?(.+)$/);
    if(m){cant=/docena/.test(m[1])?1:(+m[1]||NUM[m[1]]||1);t=m[2]}
    t=t.replace(/^(kilo|kilos|paquete|paquetes|botella|botellas|bote|botes|lata|latas|bolsa|bolsas|brik|briks|litro|litros)\s+(de\s+)?/,'');
    return{nombre:t.charAt(0).toUpperCase()+t.slice(1),cant};
  }).filter(p=>p.nombre.length>=2);
}
let rec=null;
async function escucharNativo(){
  const b=$('#qVoz');b.classList.add('on');
  try{const r=await natCall('voz');b.classList.remove('on');if(r&&r.error){toast('No se puede usar el reconocimiento de voz en este móvil.');return}
    const ps=parseVoz(r&&r.text||'');if(!ps.length)return;const nom=await anadirRapido(ps,'voz');toast('Añadido: '+nom.join(', '),[['Deshacer','deshacer']])}
  finally{b.classList.remove('on')}
}
function escuchar(){
  if(NATIVO)return escucharNativo();
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){$('#addTxt').focus();toast('Pulsa el micrófono del teclado y di el producto.');return}
  if(rec){try{rec.stop()}catch{}return}
  rec=new SR();rec.lang='es-ES';rec.interimResults=true;rec.maxAlternatives=1;
  const b=$('#qVoz');b.classList.add('on');$('#vozTxt').hidden=false;$('#vozTxt').textContent='Te escucho…';
  let final='';
  rec.onresult=e=>{let t='';for(const r of e.results)t+=r[0].transcript;$('#vozTxt').textContent=t;if(e.results[e.results.length-1].isFinal)final=t};
  rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){$('#addTxt').focus();toast('Chrome no deja usar el micrófono aquí. Usa el micrófono del teclado.')}else if(e.error!=='no-speech'&&e.error!=='aborted')toast('No te he entendido. Vuelve a probar.')};
  rec.onend=async()=>{b.classList.remove('on');$('#vozTxt').hidden=true;rec=null;
    const ps=parseVoz(final||'');if(!ps.length)return;
    const nom=await anadirRapido(ps,'voz');toast('Añadido: '+nom.join(', '),[['Deshacer','deshacer']]);};
  try{rec.start()}catch{b.classList.remove('on');$('#vozTxt').hidden=true;rec=null}
}

/* ---------- ajustes y copia ---------- */
function abrirAjustes(){
  openSheet(`<h2>Ajustes</h2>
  <h3>Copia de seguridad</h3>
  <p class="note">Tus listas, precios y hábitos se guardan en este móvil. Haz una copia para pasarlos a otro móvil o no perderlos si borras el navegador.</p>
  <div class="actions"><button class="btn ghost" data-act="exportar">Descargar copia</button><button class="btn ghost" data-act="importar">Cargar copia</button></div>
  <div class="actions"><button class="btn line" style="color:var(--danger)" data-act="borrarTodo">Borrar todos los datos</button></div>`);
}
function exportar(){
  if(NATIVO){window.Android.guardar('fotocesta-copia-'+hoy()+'.json',JSON.stringify({app:'FotoCesta',v:1,fecha:hoy(),datos:S},null,1));return}
  const blob=new Blob([JSON.stringify({app:'FotoCesta',v:1,fecha:hoy(),datos:S},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fotocesta-copia-'+hoy()+'.json';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
$('#imp').addEventListener('change',async e=>{
  const f=e.target.files?.[0];e.target.value='';if(!f)return;
  try{const d=JSON.parse(await f.text());if(d?.app!=='FotoCesta'||!d.datos)throw 0;
    for(const k in S)S[k]=d.datos[k]||{};saveLocal();closeSheet();render();toast('Copia cargada.')}
  catch{toast('Ese archivo no es una copia de FotoCesta.')}
});

window.__atras=()=>{
  if(!$('#cam').hidden){cerrarCamara();return true}
  if(!$('#busy').hidden){ctl?.abort();return true}
  if(!$('#sheet').hidden){closeSheet();return true}
  if(tab!=='lista'){document.querySelector('[data-tab=lista]').click();return true}
  return false;
};
/* ---------- hojas ---------- */
function openSheet(html){$('#sheetBody').innerHTML=html;$('#sheet').hidden=false}
function closeSheet(){$('#sheet').hidden=true;$('#sheetBody').innerHTML=''}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
let tt=0;function toast(m,acts){const t=$('#toast');t.textContent=m;(acts||[]).filter(Boolean).forEach(([l,a])=>{const b=document.createElement('button');b.textContent=l;b.dataset.act=a;t.appendChild(b)});t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,acts?6000:3500)}

$('#foto').addEventListener('change',e=>{const f=e.target.files;onPhotos(f?[...f]:[]);e.target.value=''});
$('#fotoRapida').addEventListener('change',e=>{const f=e.target.files?.[0];e.target.value='';if(!f)return;if(camModo==='ticket'){modoActual='ticket';onPhotos([f])}else procesarRapido(f,camModo)});
$('#fotoCam').addEventListener('change',e=>{const f=e.target.files;onPhotos(f?[...f]:[]);e.target.value=''});

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-tab],[data-act]');if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;
    document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-current',b===t?'page':'false'));
    ['lista','presu','habitos'].forEach(v=>$('#v-'+v).hidden=v!==tab);scrollTo(0,0);return}
  const a=t.dataset.act,id=t.dataset.id,x=id&&S.lista[id];
  switch(a){
    case'camara':openSheet(`<h2>¿Qué vas a fotografiar?</h2>${modesHTML()}<p class="note">La primera vez necesita internet para descargar el lector de texto y el reconocedor de imágenes (unos 150 MB). Después funciona sin conexión.</p>`);break;
    case'modo':modoActual=t.dataset.m;openSheet(`<h2>${MODOS[modoActual].t}</h2>
      <div class="modes"><button class="mode" data-act="camFoto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><b>Hacer foto</b><span>Abre la cámara</span></button>
      <button class="mode" data-act="galFoto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/></svg><b>Elegir foto</b><span>De la galería</span></button></div>
      <div class="actions"><button class="btn line" data-act="cerrar">Cancelar</button></div>`);break;
    case'camFoto':$('#fotoCam').click();break;
    case'galFoto':$('#foto').click();break;
    case'cerrar':closeSheet();break;
    case'parar':ctl?.abort();break;
    case'tog':if(x)put('lista',id,{...x,marcado:!x.marcado});break;
    case'inc':if(x)put('lista',id,{...x,cant:(x.cant||1)+1});break;
    case'dec':if(x){if((x.cant||1)<=1)del('lista',id);else put('lista',id,{...x,cant:x.cant-1})}break;
    case'rm':if(x)del('lista',id);break;
    case'sugAdd':{const p=S.productos[id];if(p)addItems([{nombre:p.nombre,cat:p.cat,cant:+t.dataset.c||1}],'habito');toast(`${p?.nombre} añadido.`);break}
    case'ajustes':abrirAjustes();break;
    case'exportar':exportar();break;
    case'importar':$('#imp').click();break;
    case'borrarTodo':if(t.dataset.ok){for(const k in S)S[k]={};saveLocal();closeSheet();render();toast('Datos borrados.')}else{t.dataset.ok='1';t.textContent='Pulsa otra vez para confirmar'}break;
    case'supTog':{const cur=S.ajustes.general?.supers||SUPERS.map(s=>s.id);const s=t.dataset.s;
      const nx=cur.includes(s)?cur.filter(v=>v!==s):[...cur,s];if(!nx.length){toast('Deja al menos un súper.');break}
      put('ajustes','general',{supers:nx});break}
    case'rvAdd':{const out=review.map((r,i)=>({...r,ok:$('#rv-ok-'+i).checked,nombre:$('#rv-n-'+i).value.trim(),cant:+$('#rv-c-'+i).value||1})).filter(r=>r.ok&&r.nombre);
      const m=t.dataset.m;closeSheet();await addItems(out,m);toast(`${out.length} productos añadidos.`);break}
    case'tkSave':saveTicket();break;
    case'qProducto':abrirCamara('producto');break;
    case'qNevera':abrirCamara('nevera');break;
    case'qVoz':escuchar();break;
    case'disparar':disparar();break;
    case'camCerrar':cerrarCamara();break;
    case'deshacer':$('#toast').hidden=true;deshacerUltimo();break;
    case'cambiar':{$('#toast').hidden=true;const alt=ultAlternativas||[];deshacerUltimo().then(()=>showReview(alt.map((x,i)=>({nombre:x.e.n,cat:x.e.c,cant:1,ok:false,motivo:(x.marca?'Artículo de '+x.marca:'Leído: «'+String(x.leido).slice(0,30)+'»')+(x.e.f?' · '+x.e.f:'')+refTxt(x.e.n)})),'producto'));break}
    case'fotoTicket':abrirCamara('ticket');break;
    case'rvChip':{syncReview();const w=t.dataset.w;const e=matchCat(w);review.push({nombre:e?e.n:cap(w.toLowerCase()),cat:e?.c,cant:1,ok:true,motivo:'De la palabra «'+w+'»'+(e?refTxt(e.n):' · sin precio de referencia')});pintaReview();break}
    case'rvNuevo':{syncReview();review.push({nombre:'',cant:1,ok:true,motivo:''});pintaReview();setTimeout(()=>{const el=$('#rv-n-'+(review.length-1));if(el)el.focus()},50);break}

    case'precio':{const p=S.productos[id];if(!p)break;const c=cheapest(id);
      openSheet(`<h2>Precio de ${esc(p.nombre)}</h2><p class="note">Pon lo que cuesta en un súper. Se guarda como precio real, igual que los de los tickets.</p>
      <div style="display:grid;grid-template-columns:1fr 110px;gap:8px"><select class="field" id="pm-sup">${SUPERS.map(s=>`<option value="${s.id}" ${c?.sup===s.id?'selected':''}>${s.n}</option>`).join('')}</select>
      <input class="field" id="pm-p" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00 €"></div>
      <div class="actions"><button class="btn" data-act="pmSave" data-id="${id}">Guardar precio</button><button class="btn line" data-act="cerrar">Cancelar</button></div>`);break}
    case'pmSave':{const v=parseFloat(String($('#pm-p').value).replace(',','.'));if(!(v>0)){toast('Escribe un precio.');break}
      const p=clone(S.productos[id]);p.precios=p.precios||{};p.precios[$('#pm-sup').value]={p:Math.round(v*100)/100,src:'ticket',f:hoy()};
      closeSheet();put('productos',id,p);toast('Precio guardado.');break}
    case'terminar':openSheet(`<h2>¿Dónde has comprado?</h2><p class="note">Apunto la compra en tus hábitos y vacío el carro. Si tienes el ticket, mejor fotografíalo: así guardo también los precios reales.</p>
      <div class="chips">${SUPERS.map(s=>`<button class="chip" data-act="fin" data-s="${s.id}">${s.n}</button>`).join('')}</div>
      <div class="actions"><button class="btn ghost" data-act="modo" data-m="ticket">Fotografiar ticket</button><button class="btn line" data-act="cerrar">Cancelar</button></div>`);break;
    case'fin':terminarCompra(t.dataset.s);break;
  }
});

loadLocal();render();
