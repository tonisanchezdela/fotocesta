name: Publicar web (iPhone)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar la web
        run: |
          mkdir -p _site
          cp app/src/main/assets/* _site/
          cp -r web/* _site/
          touch _site/.nojekyll
      - name: Publicar en la rama gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
